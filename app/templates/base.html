<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi OCR Kartu Keluarga</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold uppercase">KK OCR System</a>
            <div class="space-x-4">
                <a href="/" class="hover:underline">Daftar KK</a>
                <a href="/upload" class="bg-white text-blue-600 px-4 py-2 rounded font-bold hover:bg-gray-100">Upload KK</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-8 p-4">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 mb-4" role="alert">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
